name: spend
description: A local-first daily spend tracker for macOS.
repository: https://github.com/sepehrrezaei/spend
publish_to: none

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State and navigation
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0

  # Storage
  drift: ^2.34.2
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6

  # Presentation
  fl_chart: ^1.2.0
  intl: ^0.20.3
  meta: ^1.18.0

  # Backup, import and export
  archive: ^4.0.9
  crypto: ^3.0.7
  csv: ^8.0.0
  file_selector: ^1.1.0
  package_info_plus: ^10.2.1

  # Optional local model, over plain HTTP to loopback
  http: ^1.6.0

  # macOS menu bar residency and the global capture shortcut
  tray_manager: ^0.5.3
  hotkey_manager: ^0.2.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Runs tests inside a real macOS app process, so plugins are registered and
  # the database is a real file. `flutter test` registers no plugins, which is
  # why every existing test stubs path_provider and uses an in-memory database.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Drift generates the typed database code; run `dart run build_runner build`
  # after changing anything under lib/data/db/.
  build_runner: ^2.15.1
  drift_dev: ^2.34.0

flutter:
  uses-material-design: true

  assets:
    # Menu bar icon. A black-and-alpha template image, so macOS recolours it
    # for light and dark menu bars automatically.
    - assets/tray/
