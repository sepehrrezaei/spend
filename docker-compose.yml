# Optional local language model for the Insights tab.
#
# The app works fully without this. When the container is not running, Insights
# falls back to the deterministic cards and shows no error — the model only
# ever rewrites figures the app has already computed itself.
#
#   docker compose up -d
#   docker compose exec ollama ollama pull llama3.2:3b
#
# A note on speed: Docker Desktop on Apple Silicon runs a Linux VM with no
# access to Metal, so inference here is CPU-only and roughly three times
# slower than a native `brew install ollama`. That is fine for this workload —
# one short generation on demand, streamed — but if you ever want it snappier,
# a native Ollama on 127.0.0.1:11434 is a drop-in replacement needing no app
# changes.

services:
  ollama:
    image: ollama/ollama:latest
    container_name: spend-ollama
    ports:
      # Bound to loopback deliberately. The default "11434:11434" would listen
      # on every interface and expose an unauthenticated model server to
      # anyone on the same network, including untrusted café wifi.
      - "127.0.0.1:11434:11434"
    volumes:
      # Named volume so pulled models survive `docker compose down` and are
      # not re-downloaded on every restart.
      - ollama-models:/root/.ollama
    environment:
      # Unload the model from RAM after five idle minutes. Insights is used in
      # bursts, and holding ~2GB resident between them is wasteful on a 16GB
      # machine.
      - OLLAMA_KEEP_ALIVE=5m
      # One request at a time. Parallel decoding on CPU only makes each
      # response slower, and the app never issues concurrent requests.
      - OLLAMA_NUM_PARALLEL=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  ollama-models:
